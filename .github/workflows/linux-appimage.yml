name: Linux x86_64 AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Turbo Vision
        run: git clone --depth 1 https://github.com/magiblot/tvision external/tvision

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            libcurl4-openssl-dev \
            libncursesw5-dev \
            libgpm-dev \
            libx11-dev \
            libxmu-dev \
            libxt-dev \
            libxext-dev \
            pkg-config \
            fuse

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh

      - name: Verify AppImage
        run: |
          test -f build/TvTransmission-x86_64.AppImage
          chmod +x build/TvTransmission-x86_64.AppImage
          ls -lh build/TvTransmission-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-transmission-linux-x86_64-appimage
          path: build/TvTransmission-x86_64.AppImage
          if-no-files-found: error

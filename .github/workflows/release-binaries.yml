name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Fetch Turbo Vision
        shell: pwsh
        run: git clone --depth 1 https://github.com/magiblot/tvision external/tvision

      - name: Install vcpkg dependencies
        shell: pwsh
        run: vcpkg install curl:x64-windows-static nlohmann-json:x64-windows-static

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Path build -Filter tv-transmission.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "tv-transmission.exe not found" }
          Copy-Item $exe.FullName dist/tv-transmission-windows-x64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/tv-transmission-windows-x64.exe
          if-no-files-found: error

  linux-appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Fetch Turbo Vision
        run: git clone --depth 1 https://github.com/magiblot/tvision external/tvision

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            libcurl4-openssl-dev \
            libncursesw5-dev \
            libgpm-dev \
            libx11-dev \
            libxmu-dev \
            libxt-dev \
            libxext-dev \
            pkg-config \
            fuse

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x packaging/appimage/build-appimage.sh
          ./packaging/appimage/build-appimage.sh

      - name: Collect AppImage
        run: |
          test -f build/TvTransmission-x86_64.AppImage
          mkdir -p dist
          cp build/TvTransmission-x86_64.AppImage dist/TvTransmission-linux-x86_64.AppImage
          chmod +x dist/TvTransmission-linux-x86_64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/TvTransmission-linux-x86_64.AppImage
          if-no-files-found: error

  raspberry-pi-arm64:
    name: Raspberry Pi 64-bit (aarch64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build ARM64 binary and AppDir
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:bookworm \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                cmake \
                curl \
                file \
                git \
                libcurl4-openssl-dev \
                libncursesw5-dev \
                libgpm-dev \
                libx11-dev \
                libxmu-dev \
                libxt-dev \
                libxext-dev \
                pkg-config
              rm -rf external/tvision
              git clone --depth 1 https://github.com/magiblot/tvision external/tvision
              chmod +x packaging/appimage/build-appimage-arm.sh
              ./packaging/appimage/build-appimage-arm.sh
            '

      - name: Fix AppDir permissions
        run: sudo chown -R "$USER:$USER" build-aarch64

      - name: Verify ARM64 binary
        run: |
          file build-aarch64/AppDir/usr/bin/tv-transmission
          file build-aarch64/AppDir/usr/bin/tv-transmission | grep -q 'ARM aarch64'

      - name: Prepare AppDir metadata
        run: |
          cp packaging/appimage/tv-transmission.png build-aarch64/AppDir/tv-transmission.png
          rm -f build-aarch64/AppDir/.DirIcon
          ln -s tv-transmission.png build-aarch64/AppDir/.DirIcon
          ls -l build-aarch64/AppDir/.DirIcon

      - name: Package ARM64 AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -fL -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=aarch64 ./appimagetool-x86_64.AppImage \
            build-aarch64/AppDir \
            build-aarch64/TvTransmission-linux-aarch64.AppImage
          chmod +x build-aarch64/TvTransmission-linux-aarch64.AppImage

      - name: Collect ARM64 AppImage
        run: |
          test -f build-aarch64/TvTransmission-linux-aarch64.AppImage
          mkdir -p dist
          cp build-aarch64/TvTransmission-linux-aarch64.AppImage dist/TvTransmission-linux-aarch64.AppImage
          ls -lh dist/TvTransmission-linux-aarch64.AppImage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64
          path: dist/TvTransmission-linux-aarch64.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - windows-x64
      - linux-appimage
      - raspberry-pi-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: release-assets

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: release-assets

      - name: Download Raspberry Pi ARM64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: release-linux-aarch64
          path: release-assets

      - name: Create or update release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists: updating assets"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/tv-transmission-windows-x64.exe \
            release-assets/TvTransmission-linux-x86_64.AppImage \
            release-assets/TvTransmission-linux-aarch64.AppImage \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
